<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Debug Login</title></head>
<body>
<h2>Diagnóstico de Login</h2>
<div id="out" style="font-family:monospace;white-space:pre;border:1px solid #ccc;padding:10px;margin:10px 0;"></div>
<button onclick="testar()">Testar Login Eduarda</button>
<button onclick="testarSb()">Verificar Supabase JS</button>

<script src="/supabase.js"></script>
<script>
function log(msg) {
  document.getElementById('out').textContent += msg + '\n';
}

function testarSb() {
  log('window.supabase: ' + (typeof window.supabase));
  if (window.supabase) {
    log('createClient: ' + (typeof window.supabase.createClient));
    log('✅ Supabase JS carregou corretamente!');
  } else {
    log('❌ Supabase JS NAO carregou!');
  }
}

async function testar() {
  document.getElementById('out').textContent = '';
  log('Iniciando teste...');

  if (!window.supabase) {
    log('❌ window.supabase é null - supabase.js não carregou!');
    return;
  }
  log('✅ Supabase JS carregado');

  const sb = window.supabase.createClient(
    'https://qijziqjpvtjwarkodzxp.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpanppcWpwdnRqd2Fya29kenhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMzY0ODAsImV4cCI6MjA5NTgxMjQ4MH0.TVLDYLvotFie0GDX6zhab9JGs1Vq0JFT0xIBuPXKBhQ'
  );

  log('Tentando login: eduarda@enac.com / oab321');
  const { data, error } = await sb.auth.signInWithPassword({
    email: 'eduarda@enac.com',
    password: 'oab321'
  });

  if (error) {
    log('❌ ERRO: ' + error.message);
    log('Código: ' + error.status);
  } else {
    log('✅ LOGIN OK!');
    log('User ID: ' + data.user.id);
    log('Email: ' + data.user.email);
  }
}

window.onload = function() {
  testarSb();
};
</script>
</body>
</html>
