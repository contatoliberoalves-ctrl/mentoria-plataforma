<x-dc>
<div style="font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:20px 16px;max-width:960px;margin:0 auto;color:#111">

  <div style="font-size:18px;font-weight:900;color:#0057FF;text-transform:uppercase;margin-bottom:4px">Banco de Questoes OAB</div>
  <div style="font-size:12px;color:#00A8E8;margin-bottom:20px">Acesse questoes por materia e assunto — direto no QConcursos (banca FGV). Se a busca não achar, edite o termo e tente novamente.</div>

  <sc-for list="{{ materias }}" as="mat">
    <div style="background:#fff;border:2px solid #e0e0e0;border-radius:14px;margin-bottom:12px;overflow:hidden">
      <button onclick="{{ mat.onToggle }}" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border:none;background:transparent;cursor:pointer;text-align:left">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <div style="width:10px;height:10px;border-radius:3px;flex-shrink:0;background:{{ mat.color }}"></div>
          <span style="font-size:14px;font-weight:700;color:#111">{{ mat.jwName }}</span>
          <span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:#fff;color:#00A8E8;border:2px solid #00A8E8">{{ mat.temasCount }} assuntos</span>
          <sc-if value="{{ mat.pctLabel }}" hint-placeholder-val="">
            <span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:{{ mat.pctBg }};color:{{ mat.pctColor }}">{{ mat.pctLabel }}% acerto</span>
          </sc-if>
        </div>
        <span style="font-size:14px;color:#0057FF;flex-shrink:0">{{ mat.arrow }}</span>
      </button>
      <sc-if value="{{ mat.open }}" hint-placeholder-val="">
        <div style="border-top:1px solid #ffe00022;padding:12px 16px 16px;background:#fff">
          <a href="{{ mat.jwUrl }}" target="_blank" style="display:inline-block;margin-bottom:12px;font-size:12px;font-weight:700;color:#050510;background:#0057FF;border:3px solid #0D0D0D;box-shadow:3px 3px 0 #0D0D0D;border-radius:8px;padding:7px 14px;text-decoration:none">Ver todas as questoes de {{ mat.mat }} →</a>
          <div style="display:flex;flex-direction:column;gap:6px">
            <sc-for list="{{ mat.temas }}" as="t">
              <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#FFF9E6;border-radius:9px;flex-wrap:wrap">
                <input type="text" value="{{ t.busca }}" oninput="{{ t.onBusca }}" style="flex:1;min-width:160px;font-size:12px;color:#111;font-weight:500;border:1.5px solid #ffe00044;border-radius:7px;padding:5px 9px;background:#fff;outline:none" placeholder="Termo de busca...">
                <a href="{{ t.url }}" target="_blank" style="font-size:11px;font-weight:700;color:#050510;text-decoration:none;background:#0057FF;border:3px solid #0D0D0D;box-shadow:3px 3px 0 #0D0D0D;border-radius:6px;padding:5px 12px;white-space:nowrap;flex-shrink:0">{{ t.q }} questoes →</a>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-if>
    </div>
  </sc-for>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: {}, buscas: {} };
  }
  renderVals() {
    var d = this.props.data || {};
    var self = this;
    var st = this.state;
    var jwBase = d.jwBase || 'https://www.qconcursos.com/questoes-da-oab';

    var materias = (d.materias || []).map(function(mat) {
      var isOpen = !!st.open[mat.mat];
      var pctLabel = mat.pct != null ? mat.pct : null;
      return {
        mat: mat.mat,
        jwName: mat.jwName || mat.mat,
        jwUrl: mat.jwUrl,
        color: mat.color || '#2551c3',
        temasCount: mat.temasCount || (mat.temas || []).length,
        pctLabel: pctLabel,
        pctBg: pctLabel >= 70 ? '#f0fdf4' : pctLabel >= 50 ? '#fffbeb' : '#fef2f2',
        pctColor: pctLabel >= 70 ? '#16a34a' : pctLabel >= 50 ? '#d97706' : '#dc2626',
        arrow: isOpen ? '▲' : '▼',
        open: isOpen,
        onToggle: (function(key) { return function() {
          var o = Object.assign({}, self.state.open);
          o[key] = !o[key];
          self.setState({ open: o });
        }; })(mat.mat),
        temas: (mat.temas || []).map(function(t, i) {
          var key = mat.mat + '__' + i;
          // busca customizada ou nome original do tema
          var busca = st.buscas[key] !== undefined ? st.buscas[key] : t.tema;
          var url = mat.jwUrl + '/questoes?q=' + encodeURIComponent(busca);
          return {
            tema: t.tema,
            busca: busca,
            q: t.q || '?',
            url: url,
            onBusca: (function(k) { return function(e) {
              var b = Object.assign({}, self.state.buscas);
              b[k] = e.target.value;
              self.setState({ buscas: b });
            }; })(key)
          };
        })
      };
    });
    return { materias: materias };
  }
}
</script>
